name: 自动推送配置到GitLink

on:
  schedule:
    - cron: '0 0 */2 * *'  # 每2天UTC 0点 = 北京时间8点
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 配置Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 推送配置到GitLink
        env:
          GITLINK_TOKEN: ${{ secrets.GITLINK_TOKEN }}
        run: |
          python3 << 'EOF'
          import base64, json, os, urllib.request, urllib.error
          from datetime import datetime

          TOKEN = os.environ['GITLINK_TOKEN']
          GITLINK_OWNER = "cshd982"
          GITLINK_REPO = "data"
          JPEG_HEAD_URL = "https://cdn09022024.gitlink.org.cn/api/v1/repos/cshd982/data/raw/master/LL.jpg"
          MAGIC = b"VjVsmoeD**"  # TVBox伪装magic，10字节两个星号

          def http_get(url, timeout=30):
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              return urllib.request.urlopen(req, timeout=timeout).read()

          def http_api(method, path, body=None, token=None):
              url = f"https://cdn09022024.gitlink.org.cn/api/v1{path}"
              headers = {'Content-Type': 'application/json'}
              if token:
                  headers['Authorization'] = f'token {token}'
              data = json.dumps(body).encode() if body else None
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              try:
                  resp = urllib.request.urlopen(req, timeout=30)
                  return json.loads(resp.read())
              except urllib.error.HTTPError as e:
                  err_body = e.read().decode()
                  print(f"    API错误 {e.code}: {err_body[:300]}")
                  raise

          def push_file(gitlink_file, file_bytes, msg):
              content_b64 = base64.b64encode(file_bytes).decode()
              path = f"/repos/{GITLINK_OWNER}/{GITLINK_REPO}/contents/{gitlink_file}"
              body = {"content": content_b64, "message": msg, "branch": "master"}
              try:
                  existing = http_api("GET", f"{path}?ref=master", token=TOKEN)
                  body["sha"] = existing['sha']
                  print(f"  {gitlink_file}: 更新旧文件")
              except Exception:
                  print(f"  {gitlink_file}: 新建文件(需先在网页建空文件)")
                  return False
              http_api("PUT", path, body, TOKEN)
              print(f"  ✓ {gitlink_file} 推送成功 ({len(file_bytes)} 字节)")
              return True

          now = datetime.now().strftime('%Y-%m-%d %H:%M')

          # 取完整LL.jpg做伪装头
          jpeg_full = http_get(JPEG_HEAD_URL)
          end = jpeg_full.find(b'\xff\xd9')
          jpeg_head = jpeg_full[:end+2]
          print(f"JPEG头: {len(jpeg_head)} 字节 (含FF D9)")

          # ===== 1. 多仓订阅 → cfg.bmp (fongmi tv用) =====
          print("\n=== 多仓订阅 cfg.bmp ===")
          try:
              duo = open("output/多仓订阅.json", 'rb').read()
              fake_duo = jpeg_head + MAGIC + base64.b64encode(duo)
              push_file("cfg.bmp", fake_duo, f"ADD file via upload {now}")
          except Exception as e:
              print(f"  ✗ 失败: {e}")

          # ===== 2. 单仓聚合 → cfg_single.bmp (影视仓用) =====
          print("\n=== 单仓聚合 cfg_single.bmp ===")
          try:
              single = open("output/单仓聚合.json", 'rb').read()
              fake_single = jpeg_head + MAGIC + base64.b64encode(single)
              # 自检
              te = fake_single.find(b'\xff\xd9')
              tb = fake_single[te+2+len(MAGIC):]
              tj = json.loads(base64.b64decode(tb))
              print(f"  自检: sites={len(tj.get('sites',[]))}")
              push_file("cfg_single.bmp", fake_single, f"ADD file via upload {now}")
          except Exception as e:
              print(f"  ✗ 失败: {e}")

          # ===== 3. 直播源 → data.txt =====
          print("\n=== 直播源 data.txt ===")
          m3u_url = "https://raw.githubusercontent.com/cshd982/iptv-api/master/output/user_result.m3u"
          try:
              m3u = http_get(m3u_url)
              print(f"  m3u大小: {len(m3u)} 字节")
              push_file("data.txt", m3u, f"直播自动更新 {now}")
          except Exception as e:
              print(f"  ✗ 失败: {e}")

          print("\n=== 全部完成 ===")
          EOF
